    ## 공통 규칙

    | 항목 | 규칙 | 근거 |
    |------|------|------|
    | 기본 경로 | 모든 경로는 API 출처의 `/api/*`이고 프론트는 CORS로 호출한다(SEC-07). 경로는 소문자 kebab-case 복수형 명사, 중첩 최대 2단계, 동작은 HTTP 메서드로 표현. 예외 `/api/me` | N-11, OPS-19, PRD §5.1 |
    | 버전 관리 | 경로·헤더 버전 접두사는 기준 문서에 없어 두지 않는다 | - |
    | 메서드 | `GET`은 상태를 바꾸지 않는다. 상태 변경은 `POST`·`PATCH`·`DELETE`만. 예외는 소셜 로그인 콜백 `GET /api/auth/oauth/{provider}/callback` 하나(제공자 리다이렉트가 `GET`) | N-13, SEC-07, SEC-13 |
    | 인증 | 액세스 토큰: `HS384` JWT, 15분, 쿠키 `access_token`(`Path=/`). 리프레시 토큰: `crypto.randomBytes(32)` 불투명 문자열, 7일 절대 만료, DB에는 SHA-256 해시만, 쿠키 `refresh_token`(`Path=/api/auth`). 두 쿠키 모두 `httpOnly; Secure; SameSite=Lax`(프론트·API가 다른 사이트면 `COOKIE_SAMESITE=none`으로 `None`). JWT 페이로드는 `sub`(사용자 ID)와 `exp`만 담고 권한은 요청마다 DB로 확인 | PRD §5.2 A18·A25·A26, SEC-02, SEC-03, G-09, API-06 |
    | 공개 경로 | `POST /api/auth/signup`, `/login`, `/refresh`, `/logout`, `GET /api/auth/oauth/{provider}`, `GET /api/auth/oauth/{provider}/callback`, `GET /api/health`만 인증 없이 호출. 그 밖의 모든 `/api/*`는 액세스 토큰 필요 | SEC-04, R1, API-02 |
    | 401 처리 | 보호 API가 401 `UNAUTHENTICATED`를 주면 클라이언트는 `POST /api/auth/refresh`로 한 번 갱신한 뒤 원래 요청을 한 번 다시 보낸다. 갱신도 401이면 로그인 화면(ST-01) | OPS-10, EX-42, UI-02 |
    | CSRF·CORS | 허용 출처는 `CORS_ORIGINS`(개발 `http://localhost:5173`). 허용 출처에만 `Access-Control-Allow-Origin`(요청 출처)·`Allow-Credentials: true`, preflight는 204(`GET, POST, PATCH, DELETE`, `Content-Type`). 목록 밖 출처의 `POST`·`PATCH`·`DELETE`는 403 `FORBIDDEN`(같은 출처·`Origin` 없는 요청은 통과). 상태 변경 GET 금지, CSRF 토큰 없음 | PRD §5.2, SEC-07 |
    | JSON 이름 | 필드·쿼리 파라미터는 camelCase. 열거 값은 UPPER_SNAKE_CASE. 식별자는 `uuid` | N-09, N-14, N-20, G-07 |
    | 일시 | ISO 8601 + 오프셋, 분 단위(예: `2026-11-04T09:00+09:00`). 응답은 요청자 `User.timezone`의 오프셋으로 보낸다. 요청에서 오프셋 없는 일시(`2026-11-04T09:00`)는 400. 날짜만(`2026-11-04`)은 예외로 받는다(S-06) | PRD §5.3 A20, SEC-11, FE-10, API-09, API-10 |
    | 상태 | `status`는 저장하지 않는 계산값. 서버 현재 시각(분 단위 절삭)으로 S1→S2→S3→S4 순 판정. 요청 필드로 받지 않는다 | 도메인 §5, P-04, R5 |
    | 접근 제어 | 볼 수 없는 리소스는 404(존재 비노출), 볼 수 있으나 변경 권한이 없으면 403. 다른 사람 할일 응답에는 `category` 필드가 없다 | R2, P-05, PRD §5.2 A12, SEC-06 |
    | 입력 검증 | 길이는 앞뒤 공백 제거 후 글자 수(비밀번호는 제거하지 않음). 이메일 254, 비밀번호 8자 이상·UTF-8 72바이트 이하, 이름·카테고리·팀 이름 1–50, 제목 1–200, 설명 0–2,000. 잘못된 JSON 본문은 400 `VALIDATION_ERROR` | 시나리오 §6.3, SEC-09, C-23, API-02 |
    | 본문 크기 | 요청 본문 100KB 초과는 413 `PAYLOAD_TOO_LARGE` | PRD A19, SEC-10 |
    | 목록 페이지네이션 | `limit`/`offset`, 기본 50·최대 100(`limit=101`은 400), 시작 일시 오름차순, 응답 `{ items, total }`(`total`은 필터 적용 후 전체 건수) | PRD §5.1 A16·U-12, OPS-15, API-10, UI-02 |
    | 캘린더 조회 | `GET /api/todos?from=&to=`. 최대 42일(43일은 400), 최대 500건, 응답 `{ items, truncated }` | PRD §5.1 U-13, OPS-16, EX-39, API-10 |
    | Rate limit·캐시 | 기준 문서에 정의가 없어 명세하지 않는다 | - |

    ## 에러 응답

    본문은 항상 `{ "error": { "code", "message", "fields"? } }`이다. `fields`는 입력 오류일 때 필드별 메시지를 담을 수 있다.
    메시지는 한국어 한 가지이며 프론트엔드는 `code`로 분기하고, 화면에는 `code`의 번역을 우선 보여 주며 번역이 없는 코드만 `message`를 그대로 표시한다(OPS-07, OPS-10, 시나리오 §6.2, PRD FR-13).
    `OAUTH_FAILED`·`OAUTH_EMAIL_REQUIRED`는 JSON 본문으로 오지 않고 소셜 로그인 콜백의 302 `Location`(`/login?error=<코드>`)으로 전달된다.
    새 코드는 시나리오 §6.2에 먼저 추가한 뒤 쓴다(N-16).

    | 상태 | code | 메시지 | 사용처 |
    |------|------|--------|--------|
    | 400 | `VALIDATION_ERROR` | 입력값을 확인해 주세요. | 필수값 누락, 형식·길이 위반, 공백만 있는 이름, 42일 초과 캘린더 기간, 구성원 제거 API로 자기 자신 지정 |
    | 400 | `INVALID_PERIOD` | 종료 일시는 시작 일시보다 빠를 수 없습니다. | 종료 < 시작 |
    | 400 | `INVALID_SHARE_TEAM` | 속한 팀에만 공유할 수 있습니다. | 속하지 않은 팀 공유 |
    | 400 | `INVALID_OWNER` | 선택한 팀의 구성원만 소유자로 지정할 수 있습니다. | 대리 등록 시 비구성원 지정, 팀 나가기의 다음 소유자가 다른 구성원이 아님 |
    | 400 | `WRONG_PASSWORD` | 현재 비밀번호가 올바르지 않습니다. | 비밀번호 변경(소셜 전용 계정의 변경 요청 포함) |
    | 400 | `OAUTH_FAILED` | 소셜 로그인에 실패했습니다. 다시 시도해 주세요. | 소셜 로그인 실패 전반. JSON이 아니라 `/login?error=` 쿼리로 전달 |
    | 400 | `OAUTH_EMAIL_REQUIRED` | 확인된 이메일이 있는 계정으로 로그인해 주세요. | 소셜 로그인에서 이메일 없음·미확인. `/login?error=` 쿼리로 전달 |
    | 401 | `UNAUTHENTICATED` | 로그인이 필요합니다. | 미인증, 액세스 토큰 만료, 리프레시 토큰 만료·폐기·재사용 |
    | 401 | `INVALID_CREDENTIALS` | 이메일 또는 비밀번호가 올바르지 않습니다. | 로그인 실패(이메일 존재 여부 비노출). 소셜 전용 계정의 비밀번호 로그인 포함 |
    | 403 | `FORBIDDEN` | 권한이 없습니다. | 볼 수 있으나 변경 권한 없음, 일반 팀원의 소유자 지정, 비소유자의 팀 나가기 |
    | 403 | `DEFAULT_CATEGORY_PROTECTED` | 기본 카테고리는 삭제하거나 이름을 바꿀 수 없습니다. | 기본 카테고리 변경·삭제 |
    | 404 | `NOT_FOUND` | 찾을 수 없습니다. | 볼 수 없거나 없는 할일·카테고리·팀, 키가 없거나 알 수 없는 소셜 제공자 경로 |
    | 404 | `USER_NOT_FOUND` | 가입되지 않은 이메일입니다. | 구성원 추가 |
    | 409 | `EMAIL_TAKEN` | 이미 가입된 이메일입니다. | 회원가입 |
    | 409 | `CATEGORY_NAME_TAKEN` | 같은 이름의 카테고리가 있습니다. | 카테고리 추가·이름 변경 |
    | 409 | `TEAM_NAME_TAKEN` | 같은 이름의 팀이 있습니다. | 팀 생성 |
    | 409 | `ALREADY_MEMBER` | 이미 팀 구성원입니다. | 구성원 추가 |
    | 409 | `OWNER_MUST_TRANSFER` | 다음 소유자를 지정한 뒤 나갈 수 있습니다. | 팀 나가기, 다음 소유자 미지정(`NO_NEXT_OWNER` 다음 순서) |
    | 409 | `NO_NEXT_OWNER` | 다음 소유자로 지정할 구성원이 없습니다. | 팀 나가기, 다른 구성원 없음(가장 먼저 검사) |
    | 413 | `PAYLOAD_TOO_LARGE` | 요청이 너무 큽니다. | 본문 100KB 초과 |
    | 500 | `INTERNAL_ERROR` | 일시적인 오류가 발생했습니다. 잠시 후 다시 시도해 주세요. | 서버 오류(내부 정보 비노출) |

    ## 실행 계획에서 채택한 API 세부

    기준 문서에 없고 실행 계획(`docs-local/261104-full-stack-plan.md`)이 정한 항목이다. 해당 위치에는 Task ID로 근거를 적었다.

    | 항목 | 내용 | 근거 |
    |------|------|------|
    | 할일 단건 조회 | `GET /api/todos/{todoId}`, 볼 수 없거나 없으면 404 | API-10 #3 |
    | 할일 응답 필드 | `id`, `title`, `description`, `startAt`, `endAt`, `completed`, `completedAt`, `status`, `owner { id, name }`, `sharedTeams [{ id, name }]`(보는 사람의 팀만), `canEdit`, `isOwner`, 소유자 본인일 때만 `category { id, name }` | API-10 #4 |
    | 목록·캘린더 응답 | 목록 `{ items, total }`, 캘린더 `{ items, truncated }` | UI-02 #3, API-10 |
    | 목록 파라미터 | F4 `teamId` \| `userId` \| 없음(전체), F2 `categoryId`, F1 `status`, `limit`·`offset`, 캘린더 `from`·`to` | API-10 #1 |
    | 캘린더 겹침 | `startAt < to AND endAt >= from` | API-10 #1 |
    | 등록 요청 필드 | `teamId?`, `ownerId?`, `title`, `description?`, `startAt?`, `endAt?`, `categoryId?`, `sharedTeamIds?` | API-09 #1 |
    | 수정 요청 필드 | `title`, `description`, `startAt`, `endAt`, `completed`, `categoryId`, `sharedTeamIds` 중 보낸 것만 | API-11 #1 |
    | 내 정보 | `GET /api/me` 응답 `id`, `email`, `name`, `timezone`, `hasPassword`(SOC-03).`PATCH /api/me` 필드 `name`, `timezone`, `currentPassword`, `newPassword`. 비밀번호 변경 시 그 사용자 리프레시 토큰 전체 삭제 + 현재 브라우저에 토큰 2종 재발급 | API-06 #6, API-12 |
    | 토큰 갱신 실패 | 401 `UNAUTHENTICATED`와 함께 쿠키 2개 삭제 | API-06 #4 |
    | 역할 변경 | `MANAGER` ↔ `MEMBER`만, `OWNER` 지정은 400 | API-08 #4 |
    | 팀 나가기 본문 | `nextOwnerId` | API-14 #1 |
    | 이력 | 실제 변경이 없는 PATCH는 이력을 남기지 않는다 | API-13 #2 |
    | 헬스 | `GET /api/health`는 200 | CM-02, API-01 |

    ## 확인 필요 사항

    기준 문서와 실행 계획 모두 API 세부(경로, 상태 코드, 필드 이름 등)를 정하지 않아 이 명세에서 정한 항목이다. 해당 위치의 description에 `S-xx`로 표시했다.

    | ID | 내용 | 위치 |
    |----|------|------|
    | S-01 | 성공 상태 코드: 생성은 `201`(본문에 생성된 리소스), 수정은 `200`(본문에 갱신된 리소스), 삭제·로그아웃·토큰 갱신·팀 나가기는 `204`(본문 없음). 로그인은 `200` | 전체 |
    | S-02 | 카테고리·팀·구성원·이력 목록도 할일 목록과 같이 배열을 `{ items }`에 담는다 | 목록 응답 |
    | S-03 | 캘린더 모드 세부: `from`·`to`를 둘 다 주면 캘린더 모드. 범위는 반열린 구간 `[from, to)`이고 `from < to`이고 `from`의 날짜부터 `to` 직전 날짜까지 요청자 `User.timezone` 기준 달력 날짜로 42일 이하(시간 수로 세지 않는다. 서머타임 시간대에서 6주 달력이 1,007·1,009시간이 될 수 있음). 하나만 주거나 `from >= to`면 400 `VALIDATION_ERROR`. 캘린더 모드에 `limit`·`offset`을 보내면 400. 화면은 F4만 쓰지만 API는 `status`·`categoryId`도 AND로 받는다. 정렬은 시작 일시 오름차순 | `GET /api/todos` |
    | S-04 | F4 세부: `teamId`와 `userId`를 함께 주면 400 `VALIDATION_ERROR`. 내가 고를 수 없는 팀·사용자·카테고리 ID는 오류 없이 빈 결과(볼 수 있는 할일 안에서만 거르므로 존재를 드러내지 않음). uuid 형식이 아니면 400 | `GET /api/todos` |
    | S-05 | `offset`은 0 이상 정수(음수는 400). `limit` 0 이하도 400. 같은 시작 일시 안에서는 `id` 오름차순으로 순서를 고정한다(페이지 간 누락·중복 방지, FR-05 #6). 정렬 파라미터는 문서에 없어 두지 않는다 | `GET /api/todos` |
    | S-06 | 일시 요청에 날짜만(`YYYY-MM-DD`)도 받는다. 날짜만 보내면 요청자 `User.timezone` 기준으로 시작 00:00, 종료 23:59를 서버가 채운다(R5). 시각이 있으면 오프셋 필수(SEC-11), 초는 생략 또는 `:00`만 | `startAt`, `endAt` |
    | S-07 | 할일 등록 기본값: `ownerId` 생략 시 본인, `sharedTeamIds` 생략 시 `teamId`가 있으면 `[teamId]`, 없으면 `[]`. 대리 등록에서는 `sharedTeamIds`를 받지 않는다(보내면 400 `VALIDATION_ERROR`, 서버가 `[teamId]`로 고정). `teamId` 없이 `ownerId`를 본인이 아닌 사람으로 보내면 400 `VALIDATION_ERROR` | `POST /api/todos` |
    | S-08 | 할일 수정: 빈 본문은 400 `VALIDATION_ERROR`. 소유자가 아닌 사람이 `categoryId` 또는 `sharedTeamIds` 필드를 보내면 값과 관계없이 403. `title`·`startAt`·`endAt`·`completed`는 `null` 불가, `description`은 `null`로 비운다. `sharedTeamIds`는 공유 팀 전체를 그 목록으로 바꾼다 | `PATCH /api/todos/{todoId}` |
    | S-09 | 프론트엔드는 수정 요청에 바뀐 필드만 보낸다. 요청 본문의 정의되지 않은 필드(`status`, `completedAt`, `email` 등)는 400 `VALIDATION_ERROR`(모든 요청 스키마 `additionalProperties: false`). 실행 계획 API-12는 `email`을 '무시 또는 400'으로 두어 400으로 정했다 | 모든 요청 본문 |
    | S-10 | 이력 항목 필드 `id`, `action`, `actor { id, name }`(할일 응답의 `owner`와 같은 형태), `changedAt`, `changes`. 최신순, 페이지네이션 없음(전체 반환) | `GET /api/todos/{todoId}/histories` |
    | S-11 | 내 정보 수정: `newPassword`를 보내면 `currentPassword` 필수(없으면 400 `VALIDATION_ERROR`). 응답은 수정된 `Me` | `PATCH /api/me` |
    | S-12 | 가입·로그인 응답 본문은 `Me`(`GET /api/me`와 같은 형태). 가입도 토큰 쿠키 2종을 발급한다(가입 후 자동 로그인, R16·C-01 확인). 로그아웃은 쿠키가 없거나 무효여도 `204`이고 두 쿠키를 삭제한다 | `/api/auth/*` |
    | S-13 | 팀 목록 항목 `id`, `name`, `role`(요청자의 역할), `color`(요청자 본인의 캘린더 팀 색, 없으면 `null`). 구성원 항목에 `userId`를 더한다(경로 `{userId}`에 필요). 팀 목록은 이름 오름차순, 구성원은 소유자 → 관리자 → 일반 팀원, 같은 역할 안에서 이름 오름차순 | `GET /api/teams`, `GET /api/teams/{teamId}/members` |
    | S-14 | 역할 변경 대상이 소유자(요청자 자신)이면 400 `VALIDATION_ERROR`, 대상이 그 팀 구성원이 아니면 404 `NOT_FOUND`. 성공 시 `200`과 갱신된 구성원 | `PATCH /api/teams/{teamId}/members/{userId}` |
    | S-15 | 구성원 제거 대상이 그 팀 구성원이 아니면 404 `NOT_FOUND` | `DELETE /api/teams/{teamId}/members/{userId}` |
    | S-16 | 헬스는 공개 경로이고 응답은 서버·DB 상태만 담는다: 정상 `200 {"server":"ok","db":"ok"}`, DB 연결 실패 `503 {"server":"ok","db":"error"}`(내부 정보 없음). SEC-04 v0.11에 반영, v0.13에서 상태 분리로 변경 | `GET /api/health` |
    | S-17 | 카테고리 응답 필드 `id`, `name`, `isDefault`. 목록은 기본 카테고리 먼저(U-18 [제안] 채택), 그다음 이름 오름차순 | `/api/categories` |

    ## 문서 간 불일치(참고)

    | 내용 | 이 명세의 처리 |
    |------|----------------|
    | N-11 API 경로 예시에 할일 단건 조회가 없지만 US-07 #4·US-12 #6·EX-21·FR-06 #2는 ID 직접 조회를 전제한다 | 실행 계획 API-10 #3의 `GET /api/todos/{todoId}` 채택 |
    | SEC-11·API-09는 오프셋 없는 일시를 400으로 거부하지만, R5·`period.js`(서버)는 '시각을 입력하지 않은' 값에 00:00/23:59를 채워야 한다. 시각 없는 값을 보내는 형식이 어느 문서에도 없다 | S-06(날짜만 허용). SEC-11 v0.11, PRD v0.14 §5.3·A20에 예외로 반영해 해소 |
    | SEC-04·API-02의 공개 경로 4개에 `/api/health`가 없어 인증이 필요한데, CM-02는 '배포 URL에서 `GET /api/health`가 200'을 완료 조건으로 둔다(인증 없이 호출하는 것으로 읽힘) | SEC-04 v0.11에서 헬스를 공개 경로로 추가해 해소(S-16) |
    | PRD FR-01 #6·시나리오 EX-05는 '회원가입·로그인 외 API는 인증 없이 401'이라, 갱신·로그아웃·헬스를 공개로 둔 SEC-04(와 PRD §5.2 ③ 갱신)와 맞지 않았다 | PRD v0.14 FR-01 #6(공개 경로 목록은 SEC-04), 시나리오 v0.13 EX-05를 고쳐 해소 |
    | 6-arch 5.1 시퀀스는 공개 경로를 `signup, login`만 적었고, SEC-04·6-arch 5.10은 `refresh`, `logout`도 공개다 | 6-arch v0.6에서 5.1을 SEC-04와 맞춰 해소 |
    | 실행 계획 API-06은 쿠키 `Secure`를 '운영'에서만 붙이지만, SEC-02는 항상 `Secure`, G-13은 개발 환경 예외 코드를 두지 않는다고 정한다 | 기준 문서를 따라 항상 `Secure`. 실행 계획 API-06을 고쳐 해소 |
    | 실행 계획 API-08 #6은 '비구성원 404 → 소유자 아님 403 → 검증' 순서지만, 6-arch 5.1은 routes의 형식·길이 검증(400)을 서비스 권한 판정보다 먼저 한다 | 기준 문서를 따라 형식 400을 먼저 검사. 실행 계획 API-08 #6을 고쳐 해소 |
    | `docs-local/schema.sql` 주석은 '세션 시간대 Asia/Seoul은 연결 설정으로 맞춘다'인데, PRD A28·OPS-14는 연결별 `SET`을 쓰지 않고 `ALTER DATABASE`로 고정한다 | API와 무관. `schema.sql` 주석을 고쳐 해소 |

servers:
  - url: /
    description: API 출처. 프론트는 `VITE_API_BASE_URL`로 이 출처를 호출한다(CORS, SEC-07). 경로는 `/api/*`(OPS-19).

tags:
  - name: auth
    description: 회원가입, 로그인, 토큰 갱신, 로그아웃 (FR-01, UC-01–UC-03), Google 소셜 로그인 (FR-12, UC-15)
  - name: me
    description: 내 정보 조회·수정 (FR-03, UC-04, 수정은 P1)
  - name: categories
    description: 본인 카테고리 CRUD (FR-02, UC-05)
  - name: todos
    description: 할일 등록·조회·수정·완료·삭제, 목록 필터, 캘린더 조회, 팀 공유 (FR-02, FR-04–FR-09, FR-11)
  - name: todo-histories
    description: 할일 변경 이력 조회 (FR-10, UC-12, P1)
  - name: teams
    description: 팀 생성·목록, 구성원 관리, 팀 나가기, 내 캘린더 팀 색 (FR-09, UC-13, UC-14, PRD A29)
  - name: health
    description: 배포 확인용 헬스 경로 (OPS-21)

security:
  - accessTokenCookie: []

paths:
  /api/auth/signup:
    post:
      tags: [auth]
      operationId: signup
      summary: 회원가입
      description: |
        이메일·비밀번호·이름으로 가입한다. 계정과 이름이 '기본'인 기본 카테고리 1개를 한 트랜잭션에서 만들고,
        둘 중 하나라도 실패하면 둘 다 만들지 않는다. 가입에 성공하면 바로 로그인된다(액세스·리프레시 토큰 쿠키 발급).

        - 이메일은 앞뒤 공백 제거 후 소문자로 바꿔 저장·비교한다. 시간대는 기본값 `Asia/Seoul`.
        - 비밀번호는 공백을 제거하지 않고 그대로 검사해 bcrypt(cost 10)로 해시만 저장한다.
        - 근거: FR-01 #1–#4·#8, R6, R16, UC-01, C-01, C-23, SEC-01, SEC-09, EX-01–EX-03, EX-37, 6-arch 5.2, API-06 #1·#3
        - S-01(201), S-12(응답 본문)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
            example:
              email: a@example.com
              password: password1234
              name: 홍길동
      responses:
        '201':
          description: 가입 성공. 계정과 기본 카테고리가 생성되고 인증 쿠키 2개가 발급된다.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetAuthCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`VALIDATION_ERROR` — 이메일 형식, 비밀번호 8자 미만·UTF-8 72바이트 초과, 이름 공백만·길이 초과(EX-03, EX-37)'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`EMAIL_TAKEN` — 이미 가입된 이메일(대소문자 무시, EX-02)'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
          description: '`INTERNAL_ERROR` — 기본 카테고리 생성 실패 포함. 계정은 생성되지 않는다(EX-01)'

  /api/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: 로그인
      description: |
        이메일·비밀번호로 로그인하고 액세스 토큰(`HS384` JWT, 15분)과 리프레시 토큰(7일) 쿠키를 발급한다.

        - 이메일은 소문자로 바꿔 비교한다(대소문자 무시).
        - 없는 이메일과 틀린 비밀번호는 같은 `INVALID_CREDENTIALS` 응답이다(이메일 존재 여부 비노출).
        - 이 경로의 401은 로그인 화면 이동 신호가 아니라 폼 오류로 표시한다(OPS-10).
        - 비밀번호가 없는 소셜 전용 계정(`hasPassword = false`)도 bcrypt 비교 없이 같은 `INVALID_CREDENTIALS`다(R22).
        - 근거: FR-01 #5·#9, FR-12 #8, R1, R16, R22, UC-02, A8, C-02, SEC-05, EX-04, EX-47, US-02, API-06 #2
        - S-01(200), S-12(응답 본문)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: A@Example.com
              password: password1234
      responses:
        '200':
          description: 로그인 성공. 인증 쿠키 2개가 발급된다.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetAuthCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`VALIDATION_ERROR` — 이메일 또는 비밀번호가 비어 있음'
        '401':
          $ref: '#/components/responses/Unauthenticated'
          description: '`INVALID_CREDENTIALS` — 없는 이메일 또는 틀린 비밀번호(두 경우 동일, EX-04)'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: 액세스 토큰 갱신(리프레시 토큰 회전)
      description: |
        쿠키 `refresh_token`(`Path=/api/auth`)으로 새 액세스 토큰과 새 리프레시 토큰을 발급한다.
        쓴 리프레시 토큰은 폐기한다(회전, 한 트랜잭션). 새 리프레시 토큰은 쓴 토큰의 만료 시각을 그대로 쓴다(7일 절대 만료, 연장 안 함).
        같은 토큰으로 동시에 두 번 갱신하면 한 번만 성공한다.

        - 이미 폐기된 토큰이 다시 오면 재사용으로 판정해 그 사용자의 리프레시 토큰을 모두 폐기하고 401이다(EX-43).
        - 실패한 401 응답은 두 쿠키를 삭제한다.
        - 액세스 토큰이 만료된 상태에서 호출하므로 공개 경로다(SEC-04).
        - 여러 탭이 거의 동시에 갱신하면 늦은 쪽이 재사용으로 판정될 수 있다(K11). 클라이언트는 한 탭 안의 401을 갱신 요청 하나로 합친다(OPS-10).
        - 근거: FR-01 #10, PRD §5.2 A25, SEC-02, SEC-04, OPS-10, EX-42, EX-43, ERD 3.6, 6-arch 5.10, API-06 #4
        - S-01(204)
      security:
        - refreshTokenCookie: []
      responses:
        '204':
          description: 갱신 성공. 새 `access_token`, `refresh_token` 쿠키가 발급된다.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetAuthCookies'
        '401':
          description: '`UNAUTHENTICATED` — 리프레시 토큰 없음·만료·폐기·재사용. 두 쿠키를 삭제한다(API-06 #4).'
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearAuthCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UNAUTHENTICATED:
                  $ref: '#/components/examples/ErrUnauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: 로그아웃
      description: |
        쿠키의 리프레시 토큰을 폐기하고(있으면) 두 인증 쿠키를 삭제한다. 액세스 토큰이 만료돼도 쿠키를 지울 수 있도록 공개 경로다.
        이미 발급된 액세스 토큰은 만료(최대 15분)까지 유효하다(인증 한계, PRD §5.2).

        - 근거: FR-01 #7, UC-03, US-02 #3, EX-06, PRD §5.2 A25, SEC-02, SEC-04, 6-arch 5.10, API-06 #5
        - S-01(204), S-12(쿠키가 없거나 무효여도 204)
      security:
        - refreshTokenCookie: []
        - {}
      responses:
        '204':
          description: 로그아웃 완료. 두 쿠키를 삭제한다.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearAuthCookies'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/oauth/{provider}:
    get:
      tags: [auth]
      operationId: oauthStart
      summary: 소셜 로그인 시작(제공자 인가 URL로 이동)
      description: |
        브라우저가 페이지 이동으로 호출하는 경로다(fetch·XHR이 아님). 무작위 `state`(32바이트)와 검증한 `next`를
        쿠키 `oauth_state`에 담고 제공자의 인가 URL로 302한다. 현재 제공자는 `google`(`openid email profile`)뿐이다.

        - `oauth_state` 쿠키: `httpOnly; Secure; SameSite=Lax; Path=/api/auth/oauth`, 10분. 값은 `{ state, next }`.
        - `next`는 앱 내부 경로(`/`로 시작하고 `//`·`/\`로 시작하지 않음)만 받고, 그 밖의 값이거나 없으면 `/`로 저장한다(오픈 리다이렉트 방지). 요청은 거부하지 않는다.
        - 인가 URL의 `redirect_uri`는 `{API_URL}/api/auth/oauth/{provider}/callback`이다. 제공자 콘솔에 이 URI를 등록해야 한다.
        - 제공자 키(`GOOGLE_CLIENT_ID`·`GOOGLE_CLIENT_SECRET`)가 설정되지 않았거나 알 수 없는 제공자 이름이면 404 `NOT_FOUND`(JSON)다.
        - 공개 경로다(SEC-04). 상태를 바꾸지 않는다(쿠키 설정만).
        - 근거: FR-12 #1·#7·#9, R22, SEC-04, SEC-13, N-11, A32, A34, US-19 #1, EX-48, EX-49, 실행 계획(`docs-local/261105-i18n-theme-social-plan.md`) 1.3, SOC-02
      security: []
      parameters:
        - $ref: '#/components/parameters/OauthProvider'
        - name: next
          in: query
          required: false
          description: '로그인 후 돌아올 앱 내부 경로(예: `/calendar`). 앱 내부 경로가 아니면 `/`로 바꾼다.'
          schema:
            type: string
          example: /calendar
      responses:
        '302':
          description: 제공자 인가 URL(`client_id`, `redirect_uri`, `response_type=code`, `scope`, `state`)로 이동한다. `oauth_state` 쿠키를 발급한다.
          headers:
            Location:
              description: 제공자 인가 URL
              schema:
                type: string
            Set-Cookie:
              description: '`oauth_state=<{state,next}>; HttpOnly; Secure; SameSite=Lax; Path=/api/auth/oauth; Max-Age=600`'
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`NOT_FOUND` — 키가 설정되지 않았거나 알 수 없는 제공자(EX-49)'

  /api/auth/oauth/{provider}/callback:
    get:
      tags: [auth]
      operationId: oauthCallback
      summary: 소셜 로그인 콜백(계정 결정 후 프론트로 이동)
      description: |
        제공자가 브라우저를 되돌려 보내는 경로다. 응답은 항상 302이고 JSON 본문이 없다. 성공하면 인증 쿠키 2종을 발급해
        `{APP_URL}{next}`로, 실패하면 인증 쿠키 없이 `{APP_URL}/login?error=<코드>`로 보낸다.

        처리 순서: ① `oauth_state` 쿠키를 지우고 쿠키의 `state`와 쿼리의 `state`를 상수 시간 비교(불일치·쿠키 없음·`code` 없음이면 실패)
        ② `code`를 토큰으로 교환(서버 `fetch`, 클라이언트 비밀 사용) ③ 프로필(`sub`, `email`, `email_verified`, `name`) 조회
        ④ 계정 결정(`oauthLogin`, 한 트랜잭션): 연결된 계정이면 그 사용자, 아니면 확인된 같은 이메일의 사용자에 연결(자동 연결),
        둘 다 없으면 사용자(비밀번호 없음)·기본 카테고리·연결 생성 ⑤ 토큰 쿠키 발급(`issueTokens`, `setTokenCookies`)과 이동.

        - 실패 코드(`error` 쿼리): `OAUTH_EMAIL_REQUIRED`(이메일이 없거나 확인되지 않았고 연결된 계정도 없음), 그 밖의 모든 실패(제공자 거절·취소, `state` 불일치, 교환·프로필 조회 실패, 10초 제한 초과, 내부 오류)는 `OAUTH_FAILED`. 예외 내용은 서버 로그에만 남긴다.
        - 제공자 호출 `fetch`는 10초 제한이다. 같은 이메일·같은 연결의 동시 가입으로 유일 제약 충돌이 나면 1회 다시 시도한다.
        - 제공자 키가 없거나 알 수 없는 제공자면 404 `NOT_FOUND`(JSON)다.
        - 공개 경로다(SEC-04). 이 경로는 `GET`이지만 계정 생성·연결과 쿠키 발급을 한다(N-13·SEC-07의 유일한 예외, `state` 쿠키 비교가 요청 위조를 막는다, SEC-13).
        - 근거: FR-12 #1–#7·#9, R22, SEC-04, SEC-07, SEC-13, A32–A34, US-19, EX-45–EX-49, 6-arch 5.11, 실행 계획(`docs-local/261105-i18n-theme-social-plan.md`) 1.3, SOC-02
      security: []
      parameters:
        - $ref: '#/components/parameters/OauthProvider'
        - name: code
          in: query
          required: false
          description: '제공자가 준 인가 코드. 없으면(제공자 거절·취소 포함) `OAUTH_FAILED`로 이동한다.'
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: '시작 경로가 만든 `state`. 쿠키의 값과 다르면 `OAUTH_FAILED`로 이동한다.'
          schema:
            type: string
      responses:
        '302':
          description: |
            이동한다. `Location`은 다음 중 하나다.
            - 성공: `{APP_URL}{next}`(`next`는 시작 때 검증한 값, 없으면 `/`). 인증 쿠키 2종을 발급한다.
            - 실패: `{APP_URL}/login?error=OAUTH_FAILED` 또는 `{APP_URL}/login?error=OAUTH_EMAIL_REQUIRED`. 인증 쿠키를 발급하지 않는다.
            어느 경우에도 `oauth_state` 쿠키를 삭제한다.
          headers:
            Location:
              description: '`{APP_URL}{next}` 또는 `{APP_URL}/login?error=<코드>`'
              schema:
                type: string
            Set-Cookie:
              $ref: '#/components/headers/SetAuthCookies'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`NOT_FOUND` — 키가 설정되지 않았거나 알 수 없는 제공자(EX-49). 이 외의 실패는 모두 302다.'

  /api/me:
    get:
      tags: [me]
      operationId: getMe
      summary: 내 정보 조회
      description: |
        로그인한 사용자 자신의 정보를 조회한다. 경로에 사용자 ID를 받지 않아 다른 사용자 정보에 접근하는 경로가 없다(N-11 예외).

        - 프론트 인증 가드, 공통 레이아웃의 사용자 이름(SC-00), 시간대 표시, 내 정보(SC-07)에 쓴다.
        - 근거: UC-04, R17, N-11, SC-00, SC-07, API-06 #6
      responses:
        '200':
          description: 내 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [me]
      operationId: updateMe
      summary: 내 정보 수정(이름·시간대·비밀번호, P1)
      description: |
        이름, 시간대, 비밀번호를 수정한다. 보낸 필드만 바꾼다. 이메일은 수정할 수 없다. 다른 사람의 프로필은 수정할 수 없다(경로 없음).

        - 시간대는 `Intl.supportedValuesOf('timeZone')`에 있는 IANA 이름만 받는다. 바꾸면 이후 모든 일시 응답의 오프셋과 '오늘' 판정(R4)이 새 시간대 기준이다.
        - 비밀번호를 바꿀 때는 현재 비밀번호를 확인한다. 틀리면 400 `WRONG_PASSWORD`(401이 아님, 401은 로그인 화면 이동 신호). 비밀번호가 없는 소셜 전용 계정(`hasPassword = false`)의 변경 요청도 `WRONG_PASSWORD`다(비밀번호 설정은 범위 밖, R22).
        - 비밀번호를 바꾸면 같은 트랜잭션에서 그 사용자의 리프레시 토큰 행을 모두 삭제하고(폐기 표시로 남기면 다른 브라우저의 옛 토큰이 재사용 감지를 일으켜 새 토큰까지 폐기된다, ERD 3.6), 이 요청에 토큰 2종을 새로 발급해 변경한 브라우저의 로그인을 유지한다.
        - 이름·시간대 저장과 비밀번호 변경은 화면에서 별도 폼이지만 같은 경로를 쓴다(U-17).
        - 근거: FR-03 #1–#5, R5, R17, UC-04, A9, U-17, C-23, SEC-02, SEC-09, EX-30, EX-31, EX-44, US-16, API-12
        - S-01(200), S-08(빈 본문 400과 같은 방식), S-09, S-11
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
            examples:
              profile:
                summary: 이름·시간대 저장
                value:
                  name: 홍길동
                  timezone: America/New_York
              password:
                summary: 비밀번호 변경
                value:
                  currentPassword: password1234
                  newPassword: newpassword5678
      responses:
        '200':
          description: 수정된 내 정보. 비밀번호를 바꾼 경우 새 인증 쿠키 2개를 함께 발급한다.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetAuthCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`VALIDATION_ERROR` — 이름 길이, IANA가 아닌 시간대, 새 비밀번호 규칙 위반, 현재 비밀번호 누락, 정의되지 않은 필드(`email` 등). `WRONG_PASSWORD` — 현재 비밀번호 불일치(EX-30)'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/categories:
    get:
      tags: [categories]
      operationId: listCategories
      summary: 내 카테고리 목록
      description: |
        본인 카테고리만 조회한다(`isDefault` 포함). 기본 카테고리가 항상 1개 있으므로 빈 목록은 없다.
        SC-06, SC-04 카테고리 선택, F2 카테고리 필터 선택지에 쓴다.

