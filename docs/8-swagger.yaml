    - 기준 문서: 도메인 정의서 v0.15, PRD v0.17, 사용자 시나리오 v0.16, 와이어프레임 v0.15,
      프로젝트 원칙 v0.17, 기술 아키텍처 v0.11, ERD v0.10
    - 참고 자료(로컬, git 추적 제외): `docs-local/261104-full-stack-plan.md`(이하 '실행 계획', Task ID `API-nn`·`CM-nn`·`UI-nn`),
      `docs-local/261105-i18n-theme-social-plan.md`(소셜 로그인 `SOC-nn`), `docs-local/schema.sql`. 기준 문서와 다르면 기준 문서를 따르고, 기준 문서에 없는 API 세부는 실행 계획을 채택했다.
    - 근거 표기: 도메인(`FR`, `R`, `S`, `F`, `UC`), PRD(`A`, `B`, `K`, `M`, `SC`, `PRD §n`),
      시나리오(`US`, `EX`, `C`, `시나리오 §6.2`), 와이어프레임(`U`, `ST`, `DLG`),
      프로젝트 원칙(`N`, `SEC`, `OPS`, `G`), 아키텍처(`T`, `6-arch 5.n`), ERD(`E`), 실행 계획(`API-nn`, `CM-nn`, `UI-nn`, `W-nn`).
