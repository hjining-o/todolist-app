  /api/todos:
    get:
      tags: [todos]
      operationId: listTodos
      summary: 할일 목록·캘린더 조회
      description: |
        내가 볼 수 있는 할일(내 할일 + 내가 속한 팀에 공유된 할일)을 조회한다. 한 경로가 두 모드를 가진다(N-11).

        **목록 모드**(`from`·`to` 없음, SC-03)
        - F4(`teamId`/`userId`), F2(`categoryId`), F1(`status`)을 AND로 적용한다(F3). 아무것도 고르지 않으면 볼 수 있는 전체다.
        - 상태 필터는 서버(SQL)에서 적용한 뒤 페이지네이션한다. 시작 일시 오름차순, 기본 50건·최대 100건, `total`은 필터 적용 후 전체 건수
          (예: 120건 중 조건에 맞는 70건이면 `total=70`, 1쪽 50건, 2쪽 20건).

        **캘린더 모드**(`from`·`to` 모두 있음, SC-05)
        - `startAt < to AND endAt >= from`인 할일, 즉 조회 범위와 기간이 하루라도 겹치는 할일을 모두 돌려준다(R15).
        - 범위 최대 42일(43일은 400 `VALIDATION_ERROR`, EX-39), 결과 최대 500건, 넘으면 500건과 `truncated: true`.

        **공통**
        - `status`는 서버 현재 시각(분 단위 절삭)으로 S1→S2→S3→S4 순 계산한다(R5, 도메인 §5).
        - 다른 사람 할일에는 `category`가 없다(R2, SEC-06). `sharedTeams`는 보는 사람이 속한 팀만 담는다(R21).
        - 행마다 `canEdit`, `isOwner`로 버튼 노출과 카테고리 필드 활성 여부를 정한다(FE-07, N-15).
        - 일시는 요청자 `User.timezone` 오프셋이다.
        - 근거: FR-05 #1–#6, FR-08 #2–#4, FR-09 #3·#7·#11, FR-11 #2·#6, R2, R5, R15, R21, S1–S4, F1–F4, UC-07, UC-11, A16, U-12, U-13, OPS-15–OPS-17, SEC-12, EX-10–EX-14, EX-39, US-08, US-09, 6-arch 5.5, API-10
        - S-03, S-04, S-05
      parameters:
        - name: teamId
          in: query
          required: false
          description: 'F4 팀 하나. 그 팀에 공유된 할일만(API-10 #1). `userId`와 함께 쓸 수 없다(S-04).'
          schema:
            type: string
            format: uuid
        - name: userId
          in: query
          required: false
          description: 'F4 사용자 하나. 내가 속한 팀들의 구성원 또는 본인("내 할일"). 그 사용자의 할일 중 내가 볼 수 있는 것만(API-10 #1, U-01, C-06). `teamId`와 함께 쓸 수 없다(S-04).'
          schema:
            type: string
            format: uuid
        - name: categoryId
          in: query
          required: false
          description: 'F2 카테고리 필터. 본인 카테고리이며 본인 할일에만 적용된다(F2, R2, API-10 #1). 본인 것이 아니면 빈 결과(S-04).'
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          description: 'F1 상태 필터. 하나만 고른다. 허용 목록 밖 값은 400(SEC-12, API-10).'
          schema:
            $ref: '#/components/schemas/TodoStatus'
        - name: limit
          in: query
          required: false
          description: '목록 모드 페이지 크기. 기본 50, 최대 100(`limit=101`은 400, API-10). 캘린더 모드에서는 보내면 400(S-03, S-05).'
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          required: false
          description: '목록 모드 건너뛸 건수. 기본 0, 최대 999,999,999(9자리 이하 정수, 넘으면 400). 캘린더 모드에서는 보내면 400(S-03, S-05).'
          schema:
            type: integer
            minimum: 0
            maximum: 999999999
            default: 0
        - name: from
          in: query
          required: false
          description: '캘린더 조회 시작(포함). ISO 8601 + 오프셋(API-10). `to`와 함께 보내야 한다(S-03).'
          schema:
            $ref: '#/components/schemas/DateTimeOffset'
          example: '2026-10-25T00:00+09:00'
        - name: to
          in: query
          required: false
          description: '캘린더 조회 끝(제외). ISO 8601 + 오프셋. `from`부터 `to`까지 요청자 시간대 기준 달력 날짜로 42일 이하(OPS-16, S-03).'
          schema:
            $ref: '#/components/schemas/DateTimeOffset'
          example: '2026-12-06T00:00+09:00'
      responses:
        '200':
          description: 목록 모드는 `TodoPage`, 캘린더 모드는 `TodoCalendar`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TodoPage'
                  - $ref: '#/components/schemas/TodoCalendar'
              examples:
                list:
                  summary: 목록 모드
                  value:
                    items:
                      - id: 0a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                        title: 분기 기획안 v2
                        description: null
                        startAt: '2026-11-10T09:00+09:00'
                        endAt: '2026-11-12T18:00+09:00'
                        completed: false
                        completedAt: null
                        status: NOT_STARTED
                        owner:
                          id: 7e9a1c3b-5d2f-4e6a-8b0c-1d2e3f4a5b6c
                          name: 홍길동
                        category:
                          id: 3f0c2a8e-6a51-4c47-9f61-2f1b1d7e9a10
                          name: Work
                        sharedTeams:
                          - id: 8b6d3c1e-2f4a-4e9b-a1c7-5d0e9f3b2a64
                            name: 마케팅팀
                        canEdit: true
                        isOwner: true
                    total: 70
                calendar:
                  summary: 캘린더 모드
                  value:
                    items: []
                    truncated: false
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`VALIDATION_ERROR` — 허용 목록 밖 `status`, uuid가 아닌 ID, `teamId`·`userId` 동시 지정, `limit`·`offset` 범위 위반, `from`·`to` 한쪽만·순서 오류·42일 초과(EX-39)'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [todos]
      operationId: createTodo
      summary: 할일 등록
      description: |
        할일을 등록한다. 먼저 어느 팀 할일인지(`teamId`, 없으면 개인 할일) 정하고, 그 팀의 관리자(소유자 포함)이면 소유자를 그 팀 구성원 중에서 고를 수 있다(기본값 본인).

        - **소유자 = 본인**: 카테고리를 지정하지 않으면 기본 카테고리. 다른 사람 카테고리나 없는 ID는 404. 공유 팀은 내가 속한 팀 중에서 고르고, 기본값은 고른 팀(없으면 공유 없음 = 본인만 조회).
        - **소유자 ≠ 본인(대리 등록)**: 카테고리는 소유자의 기본 카테고리, 공유 팀은 고른 팀으로 고정. `categoryId`를 보내면 403.
        - **일시(R4)**: 둘 다 없음 → 오늘 00:00–23:59, 시작만 → 종료 = 시작 날짜 23:59, 종료만 → 시작 = min(오늘 00:00, 종료). '오늘'은 요청자(대리 등록이면 관리자)의 `User.timezone` 기준.
        - 종료 < 시작은 400 `INVALID_PERIOD`(같은 일시 허용). 완료 여부는 받지 않고 `completed = false`로 저장한다(U-07).
        - FR-10 구현 후 `CREATED` 이력 1건(변경자 = 요청자)을 같은 트랜잭션에서 기록한다.
        - 검사 순서(6-arch 5.3, API-09 #2): 형식 400 → 고른 팀 비구성원 400 `INVALID_SHARE_TEAM` → 일반 팀원의 소유자 지정 403 → 소유자 비구성원 400 `INVALID_OWNER` → 대리 등록 카테고리 403 → 카테고리 404 → 공유 팀 400 `INVALID_SHARE_TEAM` → 기간 400 `INVALID_PERIOD`.
        - 근거: FR-02 #1, FR-04 #2–#5, FR-07 #5, FR-09 #4·#5·#10, FR-11 #1–#3, FR-10 #1·#2, R3–R5, R7, R19–R21, UC-06, A13, C-16, C-19, U-07, U-21, EX-07–EX-09, EX-22, EX-24, EX-26, EX-37, EX-38, US-01, US-04, US-12, US-13, 6-arch 5.3, API-09
        - S-01(201), S-06, S-07, S-09
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoCreateRequest'
            examples:
              personal:
                summary: 개인 할일, 제목만(R4 기본 일시)
                value:
                  title: 주간 보고서
              withPeriod:
                summary: 시작 일시만, 카테고리 지정
                value:
                  title: 분기 기획안
                  startAt: '2026-11-10T09:00+09:00'
                  categoryId: 3f0c2a8e-6a51-4c47-9f61-2f1b1d7e9a10
              proxy:
                summary: 관리자가 팀 구성원 할일 대리 등록(종료 날짜만)
                value:
                  teamId: 8b6d3c1e-2f4a-4e9b-a1c7-5d0e9f3b2a64
                  ownerId: 1c9e7b52-3d8f-4a26-b0e4-7f5a6c2d9e18
                  title: 보도자료 초안
                  endAt: '2026-11-07'
      responses:
        '201':
          description: 등록된 할일(요청자 기준 응답. 대리 등록이면 `category` 없음)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
              examples:
                own:
                  $ref: '#/components/examples/TodoOwnValue'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`VALIDATION_ERROR` — 제목 누락·공백만·길이 초과, 설명 2,000자 초과, 일시 형식(오프셋 없음 포함), 정의되지 않은 필드, `teamId` 없이 다른 소유자 지정, 대리 등록에서 `sharedTeamIds` 지정(S-07). `INVALID_PERIOD`(EX-07). `INVALID_SHARE_TEAM` — 속하지 않은 팀(EX-22). `INVALID_OWNER` — 고른 팀 비구성원을 소유자로 지정(EX-26)'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`FORBIDDEN` — 일반 팀원이 다른 사람을 소유자로 지정(EX-38), 대리 등록에서 `categoryId` 지정(C-15)'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`NOT_FOUND` — 없거나 다른 사용자의 카테고리 지정(FR-02 #6, EX-19)'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/todos/{todoId}:
    parameters:
      - $ref: '#/components/parameters/TodoId'
    get:
      tags: [todos]
      operationId: getTodo
      summary: 할일 단건 조회
      description: |
        볼 수 있는 할일 하나를 조회한다. SC-04 편집·읽기 전용 화면 진입에 쓴다(`canEdit`로 모드 결정).

        - 볼 수 없거나(공유 없음, 비구성원) 없는 할일은 404로 존재를 드러내지 않는다. 삭제한 할일도 404.
        - 다른 사람 할일에는 `category`가 없고, `sharedTeams`는 보는 사람이 속한 팀만 담는다.
        - 근거: FR-06 #2, FR-07 #6·#7, FR-08 #5, FR-09 #3, FR-11 #2·#6, R2, R12, R21, C-14, EX-21, EX-25, US-07 #4, US-12 #4–#6, 와이어프레임 5.2, API-10 #3·#4
      responses:
        '200':
          description: 할일
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
              examples:
                own:
                  $ref: '#/components/examples/TodoOwnValue'
                others:
                  $ref: '#/components/examples/TodoOthersValue'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`VALIDATION_ERROR` — `todoId`가 uuid 형식이 아님'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`NOT_FOUND` — 볼 수 없거나 없는 할일(EX-21, EX-25)'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [todos]
      operationId: updateTodo
      summary: 할일 수정·완료 처리
      description: |
        할일을 수정한다. 보낸 필드만 바꾼다. 완료·완료 해제도 별도 경로 없이 이 경로의 `completed`로 처리하고, `completedAt`은 서버가 설정한다(완료 시 서버 현재 시각, 해제 시 `null`).

        - 수정 가능: 소유자 본인, 그 할일의 공유 팀 중 한 곳에서라도 관리자(소유자 포함)인 사람. 볼 수만 있는 일반 팀원은 403, 볼 수 없으면 404.
        - `categoryId`, `sharedTeamIds`는 소유자만 바꿀 수 있다(관리자 포함 비소유자는 403). 공유 팀은 소유자가 속한 팀만(아니면 400 `INVALID_SHARE_TEAM`).
        - 카테고리를 보내지 않으면 기존 카테고리를 유지한다(R7). 수정 후 기간도 R3을 검증한다. 시작 전이라도 완료할 수 있다(R14).
        - 검사 순서(API-11 #1): 형식 400 → 볼 수 없음 404 → 수정 권한 없음 403 → 비소유자의 카테고리·공유 팀 변경 403 → 카테고리 404 → 공유 팀 400 → 기간 400 `INVALID_PERIOD`.
        - FR-10 구현 후 요청 1건에 이력 1건을 같은 트랜잭션에서 기록한다. 완료 여부가 바뀌면 `COMPLETED`/`UNCOMPLETED`, 아니면 `UPDATED`이고 함께 바뀐 필드도 모두 `changes`에 담는다. 실제 변경이 없으면 이력을 남기지 않는다(API-13 #2).
        - 역할은 요청마다 DB로 확인하므로 관리자 해제·구성원 제거가 즉시 반영된다(US-15 #2).
        - 근거: FR-07 #1–#7, FR-09 #4·#6, FR-10 #1·#2, FR-11 #1·#4, R2, R3, R7, R13, R14, R19–R21, UC-08, UC-09, N-12, A12, C-14, C-15, C-20, EX-07, EX-12, EX-20, EX-22–EX-25, EX-33, US-05, US-06, US-14, 6-arch 5.4, API-11
        - S-01(200), S-06, S-08, S-09
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoUpdateRequest'
            examples:
              complete:
                summary: 완료 체크
                value:
                  completed: true
              edit:
                summary: 제목·종료 일시 수정
                value:
                  title: 분기 기획안 v2
                  endAt: '2026-11-12T18:00+09:00'
              share:
                summary: 소유자가 공유 팀 변경
                value:
                  sharedTeamIds:
                    - 8b6d3c1e-2f4a-4e9b-a1c7-5d0e9f3b2a64
      responses:
        '200':
          description: 수정된 할일(요청자 기준 응답)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`VALIDATION_ERROR` — 빈 본문, 제목 공백만·길이 초과, 일시 형식, `null` 불가 필드에 `null`, 정의되지 않은 필드(`status` 등). `INVALID_PERIOD`(EX-07). `INVALID_SHARE_TEAM`(EX-22)'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`FORBIDDEN` — 일반 팀원의 변경(EX-20), 비소유자의 카테고리 변경(EX-24)·공유 팀 변경(EX-23)'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`NOT_FOUND` — 볼 수 없거나 없는 할일(EX-21, EX-25), 없거나 다른 사용자의 카테고리 지정(EX-19)'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [todos]
      operationId: deleteTodo
      summary: 할일 삭제
      description: |
        할일을 영구 삭제한다. 공유와 변경 이력도 함께 삭제되며(FK CASCADE) 복구할 수 없다. 같은 ID로 다시 조회하면 404다.

        - 삭제 가능: 소유자 본인, 공유 팀의 관리자(소유자 포함). 일반 팀원은 403, 볼 수 없으면 404.
        - 검사 순서: 404 → 403 → 삭제. 다른 관리자가 먼저 삭제해 삭제 행이 0이어도 404다(API-11 #2).
        - 근거: FR-06 #2·#3, FR-09 #4·#6, FR-10 #5, R2, R12, R19, R20, UC-10, A12, EX-20, EX-21, US-07, US-14 #5, 6-arch 5.4, API-11 #2
        - S-01(204)
      responses:
        '204':
          description: 삭제 완료
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`VALIDATION_ERROR` — `todoId`가 uuid 형식이 아님'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`FORBIDDEN` — 볼 수 있으나 삭제 권한 없음(일반 팀원, EX-20)'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`NOT_FOUND` — 볼 수 없거나 없는 할일(FR-06 #3, EX-21)'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/todos/{todoId}/histories:
    parameters:
      - $ref: '#/components/parameters/TodoId'
    get:
      tags: [todo-histories]
      operationId: listTodoHistories
      summary: 할일 변경 이력 조회(P1)
      description: |
        그 할일을 볼 수 있는 사용자가 변경 이력을 조회한다. 이력의 수정·삭제 API는 없다.

        - 보는 사람이 할일 소유자가 아니면 `changes`에서 `category`를 뺀다(`CREATED`의 처음 값 포함).
        - `sharedTeamIds` 변경은 보는 사람이 속한 팀 ID만 남기고, 남은 차이가 없으면 그 필드를 뺀다.
        - 걸러낸 뒤 남는 변경이 없는 이력은 응답에서 뺀다.
        - 근거: FR-10 #3·#4·#6, R2, R20, R21, UC-12, C-17, E-03, E-13, U-16, EX-32, US-17, ERD 3.5, 6-arch 5.9, API-13 #1·#3
        - S-02(`items`), S-10
      responses:
        '200':
          description: 보는 사람 기준으로 걸러낸 이력(최신순)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoHistoryList'
              example:
                items:
                  - id: 5a1f2e3d-4c5b-4a69-8e7d-9f0a1b2c3d4e
                    action: COMPLETED
                    actor:
                      id: 2d4f6a8c-1b3e-4c5d-9e7f-0a1b2c3d4e5f
                      name: 이관리
                    changedAt: '2026-11-05T10:30+09:00'
                    changes:
                      completed:
                        old: false
                        new: true
                  - id: 6b2a3f4e-5d6c-4b7a-9f8e-0a1b2c3d4e5f
                    action: UPDATED
                    actor:
                      id: 7e9a1c3b-5d2f-4e6a-8b0c-1d2e3f4a5b6c
                      name: 홍길동
                    changedAt: '2026-11-05T10:12+09:00'
                    changes:
                      category:
                        old:
                          id: 9d8c7b6a-5f4e-4d3c-8b2a-1f0e9d8c7b6a
                          name: 기본
                        new:
                          id: 3f0c2a8e-6a51-4c47-9f61-2f1b1d7e9a10
                          name: Work
                      sharedTeamIds:
                        old: []
                        new:
                          - 8b6d3c1e-2f4a-4e9b-a1c7-5d0e9f3b2a64
        '400':
          $ref: '#/components/responses/BadRequest'
          description: '`VALIDATION_ERROR` — `todoId`가 uuid 형식이 아님'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`NOT_FOUND` — 볼 수 없거나 없는(삭제된 포함) 할일'
        '500':
          $ref: '#/components/responses/InternalError'

