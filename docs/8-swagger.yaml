        F4 팀 선택지에 이 결과를 쓴다. 팀 단건 조회·이름 변경·삭제 경로는 두지 않는다.

        - 근거: FR-09, R18, UC-13, SC-08, SC-09, N-11, API-08 #1
        - S-02(`items`), S-13
