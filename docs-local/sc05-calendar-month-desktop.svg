<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="970" viewBox="0 0 1280 970" font-family="ui-sans-serif, system-ui, 'Malgun Gothic', sans-serif">
  <!-- SC-05 캘린더 데스크톱 월 뷰. docs/9-style-guide.md 적용 (shadcn neutral 토큰을 hex로 옮김) -->
  <style>
    .fg { fill: #0a0a0a; }
    .muted { fill: #737373; }
    .sm { font-size: 14px; }
    .xs { font-size: 12px; }
    .medium { font-weight: 500; }
    .semi { font-weight: 600; }
    .line { stroke: #e5e5e5; stroke-width: 1; fill: none; }
    .ctl { fill: #ffffff; stroke: #e5e5e5; stroke-width: 1; }
    .icon { fill: none; stroke: #0a0a0a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .ev { fill: #171717; }
    .evt { fill: #fafafa; font-size: 12px; font-weight: 500; }
    .day { font-size: 14px; fill: #0a0a0a; }
    .other { opacity: 0.3; }
  </style>

  <!-- body: bg-background -->
  <rect width="1280" height="970" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1279" height="969" class="line"/>

  <!-- ===== SC-00 header: h-14 border-b, max-w-5xl px-4 ===== -->
  <text x="144" y="34" class="fg semi" font-size="18">TodoList</text>
  <!-- nav: Button ghost, 현재 메뉴는 secondary -->
  <text x="286" y="33" class="fg sm medium" text-anchor="middle">목록</text>
  <rect x="320" y="10" width="74" height="36" rx="8" fill="#f5f5f5"/>
  <text x="357" y="33" class="fg sm medium" text-anchor="middle">캘린더</text>
  <text x="442" y="33" class="fg sm medium" text-anchor="middle">카테고리</text>
  <text x="513" y="33" class="fg sm medium" text-anchor="middle">팀</text>
  <text x="578" y="33" class="fg sm medium" text-anchor="middle">내 정보</text>
  <!-- 사용자 이름 + 로그아웃(outline sm) -->
  <text x="1058" y="33" class="muted sm" text-anchor="end">홍길동</text>
  <rect x="1070.5" y="12.5" width="65" height="31" rx="8" class="ctl"/>
  <text x="1103" y="33" class="fg sm medium" text-anchor="middle">로그아웃</text>
  <line x1="0" y1="56.5" x2="1280" y2="56.5" class="line"/>

  <!-- ===== 툴바: flex flex-wrap items-center gap-2 ===== -->
  <!-- 이전: outline icon -->
  <rect x="144.5" y="80.5" width="35" height="35" rx="8" class="ctl"/>
  <path d="M164 92 l-6 6 6 6" class="icon"/>
  <!-- 오늘: outline -->
  <rect x="188.5" y="80.5" width="59" height="35" rx="8" class="ctl"/>
  <text x="218" y="103" class="fg sm medium" text-anchor="middle">오늘</text>
  <!-- 다음: outline icon -->
  <rect x="256.5" y="80.5" width="35" height="35" rx="8" class="ctl"/>
  <path d="M272 92 l6 6 -6 6" class="icon"/>
  <!-- 기간 제목: text-lg font-semibold -->
  <text x="308" y="104" class="fg semi" font-size="18">2026년 11월</text>
  <!-- ToggleGroup outline: 월(선택, bg-accent) / 주 / 일 -->
  <clipPath id="tg"><rect x="420" y="80" width="132" height="36" rx="8"/></clipPath>
  <rect x="420" y="80" width="44" height="36" fill="#f5f5f5" clip-path="url(#tg)"/>
  <rect x="420.5" y="80.5" width="131" height="35" rx="8" class="line"/>
  <line x1="464.5" y1="80.5" x2="464.5" y2="115.5" class="line"/>
  <line x1="508.5" y1="80.5" x2="508.5" y2="115.5" class="line"/>
  <text x="442" y="103" class="fg sm medium" text-anchor="middle">월</text>
  <text x="486" y="103" class="fg sm medium" text-anchor="middle">주</text>
  <text x="530" y="103" class="fg sm medium" text-anchor="middle">일</text>
  <!-- + 할일 등록: Button default, ml-auto -->
  <rect x="1010" y="80" width="126" height="36" rx="8" fill="#171717"/>
  <path d="M1027 98 h12 M1033 92 v12" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round"/>
  <text x="1047" y="103" fill="#fafafa" class="sm medium">할일 등록</text>

  <!-- ===== 보기 필터(F4): Select ===== -->
  <text x="144" y="155" class="fg sm medium">보기</text>
  <rect x="176.5" y="132.5" width="179" height="35" rx="8" class="ctl"/>
  <text x="189" y="155" class="fg sm">팀 전체</text>
  <path d="M334 148 l5 5 5 -5" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== 500건 초과 안내: Alert (default) ===== -->
  <rect x="144.5" y="184.5" width="991" height="43" rx="10" class="ctl"/>
  <circle cx="168" cy="206" r="7" class="icon" stroke-width="1.6"/>
  <path d="M168 209 v-3 M168 203 h.01" class="icon" stroke-width="1.6"/>
  <text x="188" y="211" class="fg sm">일부 할일만 표시됩니다. 필터를 좁혀 주세요.</text>

  <!-- ===== FullCalendar dayGridMonth (7장 토큰 연결) ===== -->
  <!-- 오늘(11/5, 목) 칸: fc-today-bg-color = primary 6% -->
  <rect x="710.86" y="274" width="141.71" height="112" fill="#f1f1f1"/>

  <!-- 격자 -->
  <rect x="144.5" y="244.5" width="991" height="701" class="line"/>
  <g class="line">
    <line x1="285.71" y1="244" x2="285.71" y2="946"/>
    <line x1="427.43" y1="244" x2="427.43" y2="946"/>
    <line x1="569.14" y1="244" x2="569.14" y2="946"/>
    <line x1="710.86" y1="244" x2="710.86" y2="946"/>
    <line x1="852.57" y1="244" x2="852.57" y2="946"/>
    <line x1="994.29" y1="244" x2="994.29" y2="946"/>
    <line x1="144" y1="274.5" x2="1136" y2="274.5"/>
    <line x1="144" y1="386.5" x2="1136" y2="386.5"/>
    <line x1="144" y1="498.5" x2="1136" y2="498.5"/>
    <line x1="144" y1="610.5" x2="1136" y2="610.5"/>
    <line x1="144" y1="722.5" x2="1136" y2="722.5"/>
    <line x1="144" y1="834.5" x2="1136" y2="834.5"/>
  </g>

  <!-- 요일 머리: muted-foreground, font-medium, 일요일 시작(C-07) -->
  <g class="muted sm medium" text-anchor="middle">
    <text x="214.86" y="264">일</text>
    <text x="356.57" y="264">월</text>
    <text x="498.29" y="264">화</text>
    <text x="640" y="264">수</text>
    <text x="781.71" y="264">목</text>
    <text x="923.43" y="264">금</text>
    <text x="1065.14" y="264">토</text>
  </g>

  <!-- 날짜 숫자: 칸 오른쪽 위 -->
  <g class="day" text-anchor="end">
    <!-- 1주 -->
    <text x="279.71" y="292">1</text><text x="421.43" y="292">2</text><text x="563.14" y="292">3</text><text x="704.86" y="292">4</text><text x="846.57" y="292" font-weight="600">5</text><text x="988.29" y="292">6</text><text x="1130" y="292">7</text>
    <!-- 2주 -->
    <text x="279.71" y="404">8</text><text x="421.43" y="404">9</text><text x="563.14" y="404">10</text><text x="704.86" y="404">11</text><text x="846.57" y="404">12</text><text x="988.29" y="404">13</text><text x="1130" y="404">14</text>
    <!-- 3주 -->
    <text x="279.71" y="516">15</text><text x="421.43" y="516">16</text><text x="563.14" y="516">17</text><text x="704.86" y="516">18</text><text x="846.57" y="516">19</text><text x="988.29" y="516">20</text><text x="1130" y="516">21</text>
    <!-- 4주 -->
    <text x="279.71" y="628">22</text><text x="421.43" y="628">23</text><text x="563.14" y="628">24</text><text x="704.86" y="628">25</text><text x="846.57" y="628">26</text><text x="988.29" y="628">27</text><text x="1130" y="628">28</text>
    <!-- 5주 (12월은 fc-day-other: opacity .3) -->
    <text x="279.71" y="740">29</text><text x="421.43" y="740">30</text>
    <g class="other"><text x="563.14" y="740">1</text><text x="704.86" y="740">2</text><text x="846.57" y="740">3</text><text x="988.29" y="740">4</text><text x="1130" y="740">5</text></g>
    <!-- 6주 -->
    <g class="other"><text x="279.71" y="852">6</text><text x="421.43" y="852">7</text><text x="563.14" y="852">8</text><text x="704.86" y="852">9</text><text x="846.57" y="852">10</text><text x="988.29" y="852">11</text><text x="1130" y="852">12</text></g>
  </g>

  <!-- 할일 막대: fc-event-bg-color = primary, radius = radius - 4px(6px). 상태 배지 없음 -->
  <!-- 1주 -->
  <rect x="146" y="300" width="279.43" height="20" rx="6" class="ev"/>
  <text x="152" y="314" class="evt">10월 정산</text>
  <rect x="429.43" y="300" width="421.14" height="20" rx="6" class="ev"/>
  <text x="435.43" y="314" class="evt">워크숍 준비</text>
  <rect x="571.14" y="322" width="137.71" height="20" rx="6" class="ev"/>
  <text x="577.14" y="336" class="evt">주간 보고서</text>
  <rect x="571.14" y="344" width="137.71" height="20" rx="6" class="ev"/>
  <text x="577.14" y="358" class="evt">회의록 정리</text>
  <!-- dayMaxEvents: 3 → +N (누르면 일 뷰, U-13) -->
  <text x="577.14" y="379" class="muted xs medium">+3</text>
  <rect x="854.57" y="300" width="137.71" height="20" rx="6" class="ev"/>
  <text x="860.57" y="314" class="evt">캠페인 일정</text>

  <!-- 2주 -->
  <rect x="429.43" y="412" width="421.14" height="20" rx="6" class="ev"/>
  <text x="435.43" y="426" class="evt">분기 기획안 v2</text>

  <!-- 3주 -->
  <rect x="571.14" y="524" width="137.71" height="20" rx="6" class="ev"/>
  <text x="577.14" y="538" class="evt">팀 회의 자료</text>
  <!-- 주를 넘는 막대: 이어지는 쪽 모서리는 각지게 -->
  <rect x="854.57" y="524" width="281.43" height="20" rx="6" class="ev"/>
  <rect x="1126" y="524" width="10" height="20" class="ev"/>
  <text x="860.57" y="538" class="evt">연말 행사 준비</text>

  <!-- 4주 -->
  <rect x="144" y="636" width="423.14" height="20" rx="6" class="ev"/>
  <rect x="144" y="636" width="10" height="20" class="ev"/>
  <text x="150" y="650" class="evt">연말 행사 준비</text>
  <rect x="712.86" y="636" width="137.71" height="20" rx="6" class="ev"/>
  <text x="718.86" y="650" class="evt">월간 리포트</text>

  <!-- 5주 -->
  <rect x="287.71" y="748" width="137.71" height="20" rx="6" class="ev"/>
  <text x="293.71" y="762" class="evt">11월 정산</text>
</svg>
